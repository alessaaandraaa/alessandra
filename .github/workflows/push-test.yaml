name: push test
on:
  pull_request:
    branches: ["main"]

jobs:
  push-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: run npm
        run: npm ci

      - run: npm run build --if-present
